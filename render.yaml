services:
  - type: web
    name: arvo-frontdesk
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node scripts/seed.js && node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arvo-frontdesk-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: BUSINESS_ZONE
        value: Asia/Kolkata
      - key: DEMO_PASSWORD
        generateValue: true

databases:
  - name: arvo-frontdesk-db
    region: singapore
    plan: free
    ipAllowList: []
